<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Chat IA local - Danna Rivera">
<meta name="theme-color" content="#302b63">
<title>Chat IA - Danna</title>
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="header-title">🤖 Chat IA</div>
    <div class="header-sub">Asistente local — sin consumo de API</div>
  </div>

  <div class="card">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <img src="fotos/danna.png" alt="Danna Rivera" class="welcome-avatar-chat">
        <div class="welcome-title">Pregunta lo que quieras</div>
        <div class="welcome-text">Puedes consultar sobre carreras, estudios, dudas generales o lo que necesites.</div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autofocus>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
  <footer>
  <span class="footer-name">Danna Rivera</span>
  <span class="footer-details">Estudiante de Diseño · CEDES Don Bosco Costa Rica</span>
  <div class="nav-buttons">
    <a href="index.html" class="ruta-btn">🏠 Inicio</a>
    <a href="ruta-vocacional.html" class="ruta-btn">🌱 Ruta Vocacional</a>
    <a href="juego.html" class="ruta-btn">🧹 Vuelo</a>
    <a href="parejas.html" class="ruta-btn">🃏 Parejas</a>
  </div>
  <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
    <option value="modern">Moderno</option>
    <option value="retro">Win 3.1</option>
  </select>
  <span class="footer-year">© 2026</span>
</footer>
</div>
<script src="js/chat.js"></script>
</body>
</html>
