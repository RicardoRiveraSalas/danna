<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat con Gemini</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chatbox { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        #user-input { width: 80%; padding: 8px; }
        #send-btn { width: 15%; padding: 8px; }
        .nav-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
        .ruta-btn{background:linear-gradient(135deg,#ff69b4,#00bfff);color:#fff;text-decoration:none;padding:10px 20px;border-radius:25px;font-weight:600;font-size:.85em;cursor:pointer;transition:all .3s ease;box-shadow:0 4px 15px rgba(255,69,180,.3);display:flex;align-items:center;gap:6px;border:none}
        .ruta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,69,180,.5)}
        @media(max-width:600px){.ruta-btn{padding:8px 14px;font-size:.8em}}
        footer{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-top:1px solid rgba(255,255,255,.1);padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:20px}
        .footer-name{font-weight:600;font-size:.9em;opacity:.8}
        @media(max-width:600px){footer{padding:15px 20px;flex-direction:column;text-align:center}}
    </style>
</head>
<body>

    <h2>Mi Chatbot IA</h2>
    <div id="chatbox"></div>
    <input type="text" id="user-input" placeholder="Escribe un mensaje...">
    <button id="send-btn">Enviar</button>

    <!-- Importar el SDK de Google Gen AI para la web -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        // La API key se inyecta desde GitHub Secrets en el build
        const API_KEY = "GEMINI_API_KEY_PLACEHOLDER"; 
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        sendBtn.addEventListener('click', async () => {
            const message = userInput.value.trim();
            if (!message) return;

            // Mostrar mensaje del usuario
            chatbox.innerHTML += `<p><strong>Tú:</strong> ${message}</p>`;
            userInput.value = '';

            try {
                // Llamar al modelo Gemini 2.5 Flash (ideal para texto rápido)
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: message,
                });

                // Mostrar respuesta de la IA
                chatbox.innerHTML += `<p><strong>IA:</strong> ${response.text}</p>`;
                chatbox.scrollTop = chatbox.scrollHeight; // Auto-scroll al final
            } catch (error) {
                console.error(error);
                chatbox.innerHTML += `<p style="color:red;"><strong>Error:</strong> No se pudo obtener respuesta.</p>`;
            }
        });
    </script>
    <footer>
      <span class="footer-name">Danna Rivera</span>
      <div class="nav-buttons">
        <a href="index.html" class="ruta-btn">🏠 Inicio</a>
        <a href="ruta-vocacional.html" class="ruta-btn">🌱 Ruta Vocacional</a>
      </div>
    </footer>
</body>
</html>
