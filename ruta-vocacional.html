<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Vocacional - Descubre tu Carrera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  min-height:100vh;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:#fff;
  overflow-x:hidden
}
.particles{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:1
}
.particle{
  position:absolute;
  width:4px;height:4px;
  background:radial-gradient(circle,rgba(255,182,193,.8),rgba(255,182,193,0));
  border-radius:50%;
  animation:float-particle 20s infinite linear
}
@keyframes float-particle{
  0%{transform:translateY(100vh) translateX(0);opacity:1}
  100%{transform:translateY(-100vh) translateX(100px);opacity:0}
}
.container{
  position:relative;
  z-index:10;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}
.header{
  text-align:center;
  margin-bottom:40px;
}
.logo{
  font-size:3em;
  font-weight:900;
  background:linear-gradient(135deg,#ff69b4,#00bfff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:10px;
  letter-spacing:2px
}
.subtitle{
  font-size:1.2em;
  opacity:.8;
  margin-bottom:30px
}
.card{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:40px;
  max-width:600px;
  width:100%;
  box-shadow:0 8px 32px 0 rgba(31,38,135,.37)
}
.screen{
  display:none
}
.screen.active{
  display:block;
  animation:slideIn .3s ease
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.progress-bar{
  width:100%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  margin-bottom:30px;
  overflow:hidden
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#ff69b4,#00bfff);
  border-radius:10px;
  transition:width .3s ease
}
.question-title{
  font-size:1.5em;
  font-weight:600;
  margin-bottom:20px;
  text-align:center
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:30px
}
@media(max-width:500px){
  .options{grid-template-columns:1fr}
}
.option-btn{
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:20px;
  cursor:pointer;
  transition:all .3s ease;
  color:#fff;
  font-size:1em;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px
}
.option-btn:hover{
  background:rgba(255,182,193,.1);
  border-color:rgba(255,182,193,.4);
  transform:translateY(-5px)
}
.option-btn.selected{
  background:linear-gradient(135deg,rgba(255,69,180,.3),rgba(0,191,255,.3));
  border-color:#ff69b4;
  box-shadow:0 0 20px rgba(255,69,180,.3)
}
.emoji{
  font-size:2em
}
.text{
  font-size:.9em
}
.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
.btn{
  padding:12px 30px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:1em;
  font-weight:600;
  transition:all .3s ease
}
.btn-primary{
  background:linear-gradient(135deg,#ff69b4,#00bfff);
  color:#fff;
  flex:1;
  min-width:150px
}
.btn-primary:hover:not(:disabled){
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(255,69,180,.4)
}
.btn-primary:disabled{
  opacity:.5;
  cursor:not-allowed
}
.btn-secondary{
  background:rgba(255,255,255,.1);
  color:#fff;
  border:1px solid rgba(255,255,255,.2)
}
.btn-secondary:hover{
  background:rgba(255,255,255,.15);
  border-color:rgba(255,255,255,.3)
}
.loading{
  text-align:center;
  padding:40px
}
.spinner{
  width:50px;
  height:50px;
  border:4px solid rgba(255,255,255,.1);
  border-top:4px solid #ff69b4;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 20px
}
@keyframes spin{to{transform:rotate(360deg)}}
.results-grid{
  display:grid;
  gap:20px
}
.result-card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;
  padding:20px;
  transition:all .3s ease
}
.result-card:hover{
  background:rgba(255,182,193,.1);
  border-color:rgba(255,182,193,.3);
  transform:translateY(-5px)
}
.result-number{
  display:inline-block;
  width:35px;height:35px;
  background:linear-gradient(135deg,#ff69b4,#00bfff);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  margin-bottom:10px
}
.result-title{
  font-size:1.3em;
  font-weight:600;
  margin-bottom:8px
}
.result-reason{
  font-size:.95em;
  opacity:.85;
  line-height:1.5
}
.result-unis{
  font-size:.85em;
  opacity:.7;
  margin-top:10px;
  font-style:italic
}
.advice{
  background:rgba(0,191,255,.1);
  border-left:4px solid #00bfff;
  padding:20px;
  border-radius:8px;
  margin-top:30px;
  line-height:1.6
}
.share-btn{
  margin-top:20px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}
.error{
  background:rgba(255,69,180,.1);
  border:1px solid rgba(255,69,180,.3);
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  text-align:center;
  color:#ffb3d9
}
.welcome-svg{
  width:150px;
  height:150px;
  margin:0 auto 20px
}
@media(max-width:600px){
  .card{padding:25px}
  .logo{font-size:2.2em}
  .subtitle{font-size:1em}
  .options{gap:10px}
  .option-btn{padding:15px}
}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="container">
  <div>
    <div class="header">
      <div class="logo">🌱 RUTA</div>
      <p class="subtitle">Descubre tu carrera ideal</p>
    </div>
    
    <div class="card">
      <!-- Pantalla de bienvenida -->
      <div class="screen active" id="welcome">
        <svg class="welcome-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Cabeza -->
          <circle cx="100" cy="80" r="35" fill="#ff69b4"/>
          <!-- Ojos -->
          <circle cx="90" cy="75" r="4" fill="#fff"/>
          <circle cx="110" cy="75" r="4" fill="#fff"/>
          <!-- Sonrisa -->
          <path d="M 90 85 Q 100 92 110 85" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Cuerpo -->
          <path d="M 75 110 L 70 150 M 100 115 L 100 155 M 125 110 L 130 150" stroke="#00bfff" stroke-width="3" stroke-linecap="round"/>
          <!-- Brillo -->
          <circle cx="75" cy="65" r="8" fill="#ffff00" opacity="0.6"/>
        </svg>
        <h2 class="question-title">¡Hola! 👋</h2>
        <p style="text-align:center;opacity:.8;margin-bottom:30px;line-height:1.6">
          Te ayudaré a descubrir qué carrera universitaria o técnica se ajusta mejor a tu perfil. Responde 10 preguntas rápidas y obtendrás recomendaciones personalizadas.
        </p>
        <button class="btn btn-primary" onclick="startQuiz()">Comenzar Cuestionario</button>
      </div>

      <!-- Pantalla de preguntas -->
      <div class="screen" id="quiz">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="question-title" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="buttons">
          <button class="btn btn-secondary" onclick="previousQuestion()" id="prevBtn" style="display:none">← Anterior</button>
          <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>Siguiente →</button>
        </div>
      </div>

      <!-- Pantalla de carga -->
      <div class="screen" id="loading">
        <div class="loading">
          <div class="spinner"></div>
          <p style="font-size:1.1em;opacity:.8">Analizando tu perfil...</p>
        </div>
      </div>

      <!-- Pantalla de resultados -->
      <div class="screen" id="results">
        <h2 class="question-title">🎯 Tus Carreras Recomendadas</h2>
        <div class="results-grid" id="resultsContainer"></div>
        <div class="advice" id="adviceContainer"></div>
        <div class="buttons" style="margin-top:30px">
          <button class="btn btn-primary" onclick="shareResults()">📤 Compartir Resultados</button>
          <button class="btn btn-secondary" onclick="restartQuiz()">🔄 Reintentar</button>
        </div>
      </div>

      <div class="error" id="errorMsg" style="display:none"></div>
    </div>
  </div>
</div>

<script>
// Preguntas del cuestionario
const questions = [
  {
    title: "¿Cuál es tu principal fortaleza?",
    options: [
      {emoji: "🧠", text: "Análisis lógico y resolución de problemas"},
      {emoji: "🎨", text: "Creatividad e innovación"},
      {emoji: "👥", text: "Comunicación y trabajo en equipo"},
      {emoji: "🔬", text: "Observación y experimentación"}
    ]
  },
  {
    title: "¿Qué tipo de trabajo te atrae más?",
    options: [
      {emoji: "💻", text: "Trabajar con tecnología"},
      {emoji: "🏥", text: "Ayudar a otras personas"},
      {emoji: "📊", text: "Analizar datos y números"},
      {emoji: "✍️", text: "Expresar ideas y crear contenido"}
    ]
  },
  {
    title: "¿Cuál es tu ambiente ideal de trabajo?",
    options: [
      {emoji: "🏢", text: "Oficina moderna con equipos"},
      {emoji: "🌍", text: "Al aire libre o en terreno"},
      {emoji: "🔬", text: "Laboratorio o taller"},
      {emoji: "🎪", text: "Espacios dinámicos y variados"}
    ]
  },
  {
    title: "¿Qué materia te resultó más interesante en el colegio?",
    options: [
      {emoji: "⚛️", text: "Matemática y Física"},
      {emoji: "🧪", text: "Química y Biología"},
      {emoji: "📚", text: "Idiomas y Literatura"},
      {emoji: "🎭", text: "Arte y Educación Física"}
    ]
  },
  {
    title: "¿Cuál es tu objetivo profesional principal?",
    options: [
      {emoji: "💰", text: "Ganar bien y ser independiente"},
      {emoji: "🌟", text: "Hacer un impacto positivo"},
      {emoji: "📈", text: "Crecer y liderar proyectos"},
      {emoji: "❤️", text: "Disfrutar lo que hago"}
    ]
  },
  {
    title: "¿Cómo prefieres resolver problemas?",
    options: [
      {emoji: "🔍", text: "Investigar y experimentar"},
      {emoji: "📋", text: "Seguir procesos establecidos"},
      {emoji: "💡", text: "Pensar diferente y innovar"},
      {emoji: "🤝", text: "Consultar con otros"}
    ]
  },
  {
    title: "¿Qué te motiva aprender nuevas cosas?",
    options: [
      {emoji: "🎓", text: "El conocimiento en sí mismo"},
      {emoji: "🛠️", text: "Poder aplicar lo aprendido"},
      {emoji: "🏆", text: "Competir y destacar"},
      {emoji: "🌱", text: "Crecer como persona"}
    ]
  },
  {
    title: "¿Cuál es tu nivel de tolerancia al estrés?",
    options: [
      {emoji: "😌", text: "Bajo - prefiero ritmos tranquilos"},
      {emoji: "⚡", text: "Medio - trabajo bien bajo presión moderada"},
      {emoji: "🔥", text: "Alto - me activo con desafíos"},
      {emoji: "🧘", text: "Equilibrado - busco balance"}
    ]
  },
  {
    title: "¿Qué tipo de habilidades practicas frecuentemente?",
    options: [
      {emoji: "🖥️", text: "Programación y desarrollo"},
      {emoji: "🗣️", text: "Presentación y negociación"},
      {emoji: "🎬", text: "Edición y diseño multimedia"},
      {emoji: "📱", text: "Redes sociales y marketing"}
    ]
  },
  {
    title: "¿En qué campo te gustaría especializar?",
    options: [
      {emoji: "🚀", text: "Tecnología e innovación"},
      {emoji: "🌍", text: "Medio ambiente y sostenibilidad"},
      {emoji: "💼", text: "Negocios y administración"},
      {emoji: "🎓", text: "Educación y desarrollo"}
    ]
  }
];

// Estado del quiz
let currentQuestion = 0;
let answers = [];
let selectedOption = null;

// Inicializar partículas flotantes
function initParticles() {
  const container = document.getElementById('particles');
  for(let i = 0; i < 30; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animationDuration = (15 + Math.random() * 20) + 's';
    particle.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(particle);
  }
}

function startQuiz() {
  showScreen('quiz');
  currentQuestion = 0;
  answers = [];
  selectedOption = null;
  displayQuestion();
}

function displayQuestion() {
  const question = questions[currentQuestion];
  document.getElementById('questionText').textContent = question.title;
  
  const optionsContainer = document.getElementById('optionsContainer');
  optionsContainer.innerHTML = '';
  
  question.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="emoji">${option.emoji}</span><span class="text">${option.text}</span>`;
    btn.onclick = () => selectOption(index);
    if(selectedOption === index) btn.classList.add('selected');
    optionsContainer.appendChild(btn);
  });
  
  updateProgress();
  updateButtons();
}

function selectOption(index) {
  selectedOption = index;
  displayQuestion();
}

function nextQuestion() {
  if(selectedOption === null) return;
  
  answers[currentQuestion] = selectedOption;
  
  if(currentQuestion < questions.length - 1) {
    currentQuestion++;
    selectedOption = answers[currentQuestion] !== undefined ? answers[currentQuestion] : null;
    displayQuestion();
  } else {
    analyzeAnswers();
  }
}

function previousQuestion() {
  if(currentQuestion > 0) {
    answers[currentQuestion] = selectedOption;
    currentQuestion--;
    selectedOption = answers[currentQuestion] !== undefined ? answers[currentQuestion] : null;
    displayQuestion();
  }
}

function updateProgress() {
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
}

function updateButtons() {
  document.getElementById('prevBtn').style.display = currentQuestion > 0 ? 'block' : 'none';
  document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? '✓ Enviar' : 'Siguiente →';
  document.getElementById('nextBtn').disabled = selectedOption === null;
}

function analyzeAnswers() {
  answers[currentQuestion] = selectedOption;
  showScreen('loading');
  
  // Crear prompt para la IA
  const prompt = createAnalysisPrompt();
  
  // Intentar con API gratuita
  callAI(prompt);
}

function createAnalysisPrompt() {
  const answerSummary = answers.map((ans, i) => {
    const question = questions[i];
    const selectedText = question.options[ans].text;
    return `Pregunta ${i+1}: "${question.title}" - Respuesta: "${selectedText}"`;
  }).join('\n');
  
  return `Basándote en estas respuestas de un estudiante de colegio en Costa Rica:

${answerSummary}

Proporciona exactamente 4 carreras universitarias o técnicas que se ajusten a su perfil. Para cada una incluye:
1. Nombre de la carrera
2. Una razón concisa (1-2 líneas) de por qué se ajusta al perfil
3. 2-3 universidades o institutos donde se ofrece en Costa Rica (TEC, UCR, UNA, UNED, INTA, etc.)

Luego, proporciona un consejo personalizado motivador.

Formatea la respuesta así:
CARRERA 1: [nombre]
RAZON 1: [razón]
UNIS 1: [universidades]

CARRERA 2: [nombre]
RAZON 2: [razón]
UNIS 2: [universidades]

[y así para las 4 carreras]

CONSEJO: [consejo personalizado]`;
}

async function callAI(prompt) {
  try {
    // Intenta con Ollama (necesita estar corriendo localmente)
    try {
      const response = await fetch('http://localhost:11434/api/generate', {
        method: 'POST',
        body: JSON.stringify({
          model: 'llama2',
          prompt: prompt,
          stream: false
        })
      });
      
      if(response.ok) {
        const data = await response.json();
        processAIResponse(data.response);
        return;
      }
    } catch(e) {
      console.log('Ollama no disponible, usando fallback local');
    }
    
    // Fallback: usar análisis local basado en respuestas
    useLocalAnalysis();
    
  } catch(error) {
    console.error('Error:', error);
    useLocalAnalysis();
  }
}

function useLocalAnalysis() {
  // Base de datos de carreras etiquetadas por keywords
  const careers = [
    {
      name: 'Ingeniería en Sistemas Computacionales',
      tags: ['tecnología', 'lógica', 'innovación', 'programación'],
      reason: 'Tu perfil muestra fuerte inclinación hacia la tecnología, análisis lógico y resolución de problemas. Ideal para crear soluciones digitales.',
      unis: 'TEC, UCR, UNED'
    },
    {
      name: 'Ingeniería Civil',
      tags: ['construcción', 'matemática', 'física', 'proyectos'],
      reason: 'Tu pensamiento analítico y capacidad de planificación se ajustan perfectamente a proyectos de infraestructura.',
      unis: 'UCR, TEC, UNED'
    },
    {
      name: 'Medicina',
      tags: ['ayudar', 'biología', 'ciencia', 'personas'],
      reason: 'Tu motivación por ayudar a otros y interés en ciencias naturales son ideales para la medicina.',
      unis: 'UCR, UNA, UNED'
    },
    {
      name: 'Administración de Empresas',
      tags: ['negocios', 'números', 'liderazgo', 'independiente'],
      reason: 'Tu orientación hacia los negocios y capacidad de gestión te posicionan bien en administración.',
      unis: 'UNED, UCR, UNIFIEM'
    },
    {
      name: 'Psicología',
      tags: ['personas', 'comunicación', 'ayudar', 'comprender'],
      reason: 'Tu empatía y habilidades de comunicación son fundamentales en esta carrera de alto impacto social.',
      unis: 'UCR, UNA, UNED'
    },
    {
      name: 'Ingeniería Ambiental',
      tags: ['medio ambiente', 'sostenibilidad', 'ciencia', 'innovación'],
      reason: 'Tu interés en el ambiente y pensamiento innovador encajan perfectamente en soluciones sostenibles.',
      unis: 'EARTH, TEC, UNA'
    },
    {
      name: 'Diseño Gráfico y Multimedia',
      tags: ['creatividad', 'arte', 'diseño', 'expresión'],
      reason: 'Tu creatividad y capacidades artísticas son perfectas para profesiones de diseño e innovación visual.',
      unis: 'UNA, UNED, institutos privados'
    },
    {
      name: 'Enfermería',
      tags: ['ayudar', 'biología', 'personas', 'salud'],
      reason: 'Tu vocación de servicio y interés en ciencias de la salud te hacen ideal para esta carrera.',
      unis: 'UCR, UNA, CAISALAS'
    },
    {
      name: 'Ingeniería en Agronomía',
      tags: ['naturaleza', 'experimentación', 'sostenibilidad'],
      reason: 'Tu interés en trabajar al aire libre y en la naturaleza se alinea con esta carrera práctica.',
      unis: 'UNA, TEC, UCR'
    },
    {
      name: 'Contabilidad',
      tags: ['números', 'datos', 'procesos', 'negocios'],
      reason: 'Tu capacidad analítica con números te posiciona bien en finanzas y gestión contable.',
      unis: 'UNED, UCR, institutos técnicos'
    },
    {
      name: 'Educación',
      tags: ['enseñanza', 'personas', 'comunicación', 'aprendizaje'],
      reason: 'Tu interés en educación y capacidad de comunicación hacen de la docencia una opción natural.',
      unis: 'UNA, UNED, UCR'
    },
    {
      name: 'Marketing Digital',
      tags: ['marketing', 'redes sociales', 'creatividad', 'comunicación'],
      reason: 'Tu dominio de redes y pensamiento creativo son exactamente lo que busca el marketing digital.',
      unis: 'UNED, institutos técnicos, escuelas especializadas'
    }
  ];
  
  // Calcular puntuaciones
  const scores = careers.map(career => {
    let score = 0;
    let matchedTags = [];
    
    answers.forEach((ansIndex, qIndex) => {
      const answer = questions[qIndex].options[ansIndex].text.toLowerCase();
      career.tags.forEach(tag => {
        if(answer.includes(tag)) {
          score += 1;
          if(!matchedTags.includes(tag)) matchedTags.push(tag);
        }
      });
    });
    
    return { ...career, score, matchedTags };
  });
  
  // Obtener top 4
  const topCareers = scores.sort((a, b) => b.score - a.score).slice(0, 4);
  
  // Generar consejo
  const mainMotivations = getMainMotivations();
  const advice = generateAdvice(mainMotivations);
  
  displayResults(topCareers, advice);
}

function getMainMotivations() {
  const motivations = [];
  answers.forEach((ans, qIndex) => {
    motivations.push(questions[qIndex].options[ans].text);
  });
  return motivations;
}

function generateAdvice(motivations) {
  const templates = [
    "Tu perfil muestra una combinación única de habilidades. No dudes en explorar estas carreras mediante jornadas de universidades, charlas con profesionales y prácticas. ¡Tu futuro es prometedor!",
    "Tus respuestas revelan una verdadera vocación. Te recomendamos que investigues más sobre estas carreras en los sitios de las universidades y tomes decisiones informadas. ¡Adelante!",
    "Tu potencial es claro. Recuerda que la carrera perfecta es la que te apasiona y te permite crecer. Mantén tu mente abierta y explora todas las posibilidades.",
    "Las carreras recomendadas se ajustan a tu perfil. Te sugerimos conectar con mentores en estos campos para confirmar tu elección. ¡Éxito en tu camino!"
  ];
  
  return templates[Math.floor(Math.random() * templates.length)];
}

function displayResults(careers, advice) {
  const container = document.getElementById('resultsContainer');
  container.innerHTML = '';
  
  careers.forEach((career, index) => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-number">${index + 1}</div>
      <div class="result-title">${career.name}</div>
      <div class="result-reason">${career.reason}</div>
      <div class="result-unis">📍 ${career.unis}</div>
    `;
    container.appendChild(card);
  });
  
  document.getElementById('adviceContainer').innerHTML = `<strong>💬 Tu recomendación personal:</strong><br><br>${advice}`;
  
  showScreen('results');
}

function shareResults() {
  const careerNames = Array.from(document.querySelectorAll('.result-title'))
    .map(el => el.textContent)
    .join(', ');
  
  const text = `Acabo de descubrir mis carreras ideales en Ruta Vocacional: ${careerNames}. ¡Pruébalo tú también! 🌱`;
  
  if(navigator.share) {
    navigator.share({
      title: 'Ruta Vocacional',
      text: text
    });
  } else {
    alert(`Tus carreras recomendadas:\n\n${careerNames}\n\n${text}`);
  }
}

function restartQuiz() {
  showScreen('welcome');
  currentQuestion = 0;
  answers = [];
  selectedOption = null;
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

// Inicializar
initParticles();
</script>
</body>
</html>
