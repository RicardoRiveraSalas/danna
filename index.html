<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos - Dandelion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a1a;
  min-height:100vh;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:#fff;
  display:flex;
  flex-direction:column
}
.container{
  position:relative;
  flex:1;
  width:100%;
  min-height:calc(100vh - 80px);
  overflow:hidden
}
.seed{
  position:absolute;
  border-radius:50%;
  overflow:hidden;
  animation:float 8s infinite ease-in-out;
  opacity:.85;
  box-shadow:0 0 20px rgba(255,255,255,.1);
  cursor:pointer;
  transition:transform .3s,opacity .3s;
  border:2px solid rgba(255,255,255,.15)
}
.seed:hover{
  transform:scale(1.3)!important;
  opacity:1;
  z-index:100;
  box-shadow:0 0 30px rgba(255,255,255,.3)
}
.seed img{width:100%;height:100%;object-fit:cover}
@keyframes float{
  0%,100%{transform:translateY(0) translateX(0) rotate(0)}
  25%{transform:translateY(-30px) translateX(15px) rotate(5deg)}
  50%{transform:translateY(-10px) translateX(-10px) rotate(-3deg)}
  75%{transform:translateY(-25px) translateX(8px) rotate(4deg)}
}
.modal-overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
  animation:fadeIn .2s ease
}
.modal-overlay.active{display:flex}
.modal-img{
  max-width:90vw;
  max-height:90vh;
  border-radius:12px;
  box-shadow:0 0 60px rgba(255,255,255,.15);
  object-fit:contain;
  pointer-events:none
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.nav-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end
}
.ruta-btn{
  background:linear-gradient(135deg,#ff69b4,#00bfff);
  color:#fff;
  text-decoration:none;
  padding:10px 20px;
  border-radius:25px;
  font-weight:600;
  font-size:.85em;
  cursor:pointer;
  transition:all .3s ease;
  box-shadow:0 4px 15px rgba(255,69,180,.3);
  display:flex;
  align-items:center;
  gap:6px;
  border:none
}
.ruta-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(255,69,180,.5)
}
@media(max-width:600px){
  .ruta-btn{
    padding:8px 14px;
    font-size:.8em
  }
}
footer{
  position:relative;
  z-index:200;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.1);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px
}
.footer-info{display:flex;flex-direction:column;gap:2px}
.footer-name{font-size:1.1em;font-weight:600;letter-spacing:.5px}
.footer-details{font-size:.85em;opacity:.7}
.footer-year{
  font-size:1.4em;
  font-weight:700;
  background:linear-gradient(135deg,#e2e2e2,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text
}
@media(max-width:600px){
  footer{padding:15px 20px;flex-direction:column;text-align:center}
  .footer-year{font-size:1.2em}
}

/* Win 3.1 retro theme */
[data-theme="retro"] body {
  background:#c0c0c0;
  color:#000;
  font-family:"MS Sans Serif","Tahoma","Courier New",monospace
}
[data-theme="retro"] .seed{
  border-radius:0;animation:none;box-shadow:none;opacity:1;
  border:2px solid;border-color:#fff #808080 #808080 #fff
}
[data-theme="retro"] .seed:hover{
  transform:none!important;box-shadow:none
}
[data-theme="retro"] .modal-overlay{
  background:rgba(192,192,192,.92);backdrop-filter:none
}
[data-theme="retro"] .modal-img{
  border:3px solid;border-color:#fff #808080 #808080 #fff;box-shadow:none;border-radius:0
}
[data-theme="retro"] footer{
  background:#c0c0c0;backdrop-filter:none;
  border-top:2px solid;border-color:#fff #808080
}
[data-theme="retro"] .footer-name,
[data-theme="retro"] .footer-details{
  color:#000;-webkit-text-fill-color:#000;opacity:1
}
[data-theme="retro"] .footer-year{
  -webkit-text-fill-color:#000;background:none;color:#000
}
[data-theme="retro"] .ruta-btn{
  background:#c0c0c0;border:2px outset #ccc;border-radius:0;color:#000;
  box-shadow:none;font-weight:400;font-family:inherit;padding:3px 10px
}
[data-theme="retro"] .ruta-btn:hover{
  transform:none;box-shadow:none
}
[data-theme="retro"] .theme-select{
  background:#c0c0c0;border:2px inset #ccc;border-radius:0;color:#000;
  font-family:inherit;padding:2px 4px;font-size:.85em
}
[data-theme="retro"] .theme-select:focus{
  outline:2px solid #000080
}
.theme-select{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  border-radius:6px;color:#fff;padding:4px 8px;
  font-family:inherit;font-size:.8em;cursor:pointer;outline:none
}
.theme-select option{background:#1a1a2e;color:#fff}
[data-theme="retro"] .theme-select option{background:#c0c0c0;color:#000}
</style>
</head>
<body>
<div class="container" id="gallery"></div>
<div class="modal-overlay" id="modal">
  <img class="modal-img" id="modalImg" src="" alt="modal">
</div>
<footer class="footer">
  <div class="footer-info">
    <span class="footer-name">Danna Rivera</span>
    <span class="footer-details">
      Estudiante de Diseño ·  CEDES Don Bosco Costa Rica
    </span>
  </div>
  <div class="nav-buttons">
    <a href="ruta-vocacional.html" class="ruta-btn">🌱 Ruta Vocacional</a>
    <a href="chat.html" class="ruta-btn">🤖 Chat IA</a>
  </div>
  <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
    <option value="modern">Moderno</option>
    <option value="retro">Win 3.1</option>
  </select>
  <span class="footer-year">© 2026</span>
</footer>
<script>
function setTheme(t){
  document.documentElement.dataset.theme=t==='retro'?'retro':'';
  localStorage.setItem('theme',t)
}
(function(){
  const t=localStorage.getItem('theme')||'modern';
  document.documentElement.dataset.theme=t==='retro'?'retro':'';
  const sel=document.getElementById('themeSelect');
  if(sel)sel.value=t;
})();
const images=[
  'fotos/img1.webp','fotos/img2.webp','fotos/img3.webp','fotos/img4.png',
  'fotos/img5.jpg','fotos/img6.png','fotos/img7.png','fotos/img8.png',
  'fotos/img9.png','fotos/img10.png','fotos/img11.png','fotos/img12.png',
  'fotos/img13.png','fotos/img14.png','fotos/img15.png','fotos/img16.png',
  'fotos/img17.png','fotos/img18.png','fotos/img19.png','fotos/img20.png',
  'fotos/img21.png','fotos/img22.png','fotos/img23.png','fotos/img24.png',
  'fotos/img25.png','fotos/img26.png','fotos/img27.png','fotos/img28.png'
];
const container=document.getElementById('gallery');
images.forEach((src,i)=>{
  const div=document.createElement('div');
  div.className='seed';
  const x=Math.random()*90;
  const y=Math.random()*85;
  const size=60+Math.random()*50;
  const dur=6+Math.random()*6;
  const delay=Math.random()*5;
  div.style.left=x+'%';
  div.style.top=y+'%';
  div.style.width=size+'px';
  div.style.height=size+'px';
  div.style.animationDuration=dur+'s';
  div.style.animationDelay=delay+'s';
  const img=document.createElement('img');
  img.src=src;
  img.alt='img'+(i+1);
  div.appendChild(img);
  container.appendChild(div);
});
const modal=document.getElementById('modal');
const modalImg=document.getElementById('modalImg');
container.addEventListener('click',e=>{
  const seed=e.target.closest('.seed');
  if(!seed)return;
  modalImg.src=seed.querySelector('img').src;
  modal.classList.add('active');
});
modal.addEventListener('click',()=>{
  modal.classList.remove('active');
  modalImg.src='';
});
</script>
</body>
</html>
