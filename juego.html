<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Lumi Pit - Juego de carreras estilo Gran Pit">
<meta name="theme-color" content="#302b63">
<title>Lumi · Pit</title>
<link rel="stylesheet" href="css/juego.css">
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="logo-badge">
      <img src="fotos/danna.png" alt="Danna Rivera" class="avatar-mini">
      <div class="logo">🏁 LUMI PIT</div>
    </div>
    <p class="subtitle">Carrera de autos</p>
  </div>

  <div id="gameContainer">
    <div id="hud">
      <div class="hud-item">📏 <span id="dist">0</span>m</div>
      <div class="hud-divider"></div>
      <div class="hud-item">🏆 <span id="highScore">0</span>m</div>
      <div class="hud-divider"></div>
      <div class="hud-item">💨 <span id="speed">0</span>km/h</div>
    </div>

    <div id="gameArea">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="overlay">
      <div id="startScreen">
        <div class="overlay-card">
          <div class="car-preview">🏎️</div>
          <h2>🏁 ¡A correr!</h2>
          <p>Esquivá los autos con<br>las <strong>flechas</strong> ← →</p>
          <p class="controls-hint">Velocidad aumenta con el tiempo</p>
          <button id="startBtn">Comenzar</button>
        </div>
      </div>
      <div id="gameOverScreen" style="display:none">
        <div class="overlay-card">
          <div class="crash-icon">💥</div>
          <h2>¡Chocaste!</h2>
          <p class="final-score-label">Distancia</p>
          <p class="final-score" id="finalScore">0 <span style="font-size:.4em">m</span></p>
          <p class="best-label">Mejor: <span id="finalBest">0</span>m</p>
          <button id="restartBtn">Reintentar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <span class="footer-name">Danna Rivera</span>
  <span class="footer-details">Estudiante de Diseño · CEDES Don Bosco Costa Rica</span>
  <div class="nav-buttons">
    <a href="index.html" class="ruta-btn">🏠 Inicio</a>
    <a href="parejas.html" class="ruta-btn">🃏 Parejas</a>
    <a href="ruta-vocacional.html" class="ruta-btn">🌱 Ruta Vocacional</a>
    <a href="chat.html" class="ruta-btn">🤖 Chat IA</a>
  </div>
  <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
    <option value="modern">Moderno</option>
    <option value="retro">Win 3.1</option>
  </select>
  <span class="footer-year">© 2026</span>
</footer>
<script src="js/juego.js"></script>
</body>
</html>
