<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Lumi Vuelo - Juego de esquivar obstáculos volando con Danna">
<meta name="theme-color" content="#302b63">
<title>Lumi · Vuelo</title>
<link rel="stylesheet" href="css/juego.css">
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="logo-badge">
      <img src="fotos/danna.png" alt="Danna Rivera" class="avatar-mini" id="avatarMini">
      <div class="logo">🧹 LUMI VUELO</div>
    </div>
    <p class="subtitle">Esquiva obstáculos volando</p>
  </div>

  <div id="gameContainer">
    <div id="hud">
      <div class="hud-item">⭐ <span id="score">0</span></div>
      <div class="hud-divider"></div>
      <div class="hud-item">🏆 <span id="highScore">0</span></div>
    </div>

    <div id="gameArea">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="overlay">
      <div id="startScreen">
        <div class="overlay-card">
          <div class="witch-preview">
            <img src="fotos/danna.png" alt="Danna" class="preview-img">
            <div class="preview-broom"></div>
          </div>
          <h2>🧹 ¡A volar!</h2>
          <p>Usa las <strong>flechas</strong> del teclado<br>para esquivar los obstáculos</p>
          <p class="controls-hint">⬆️ ⬇️ ⬅️ ➡️</p>
          <button id="startBtn">Comenzar</button>
        </div>
      </div>
      <div id="gameOverScreen" style="display:none">
        <div class="overlay-card">
          <div class="crash-icon">💥</div>
          <h2>¡Chocaste!</h2>
          <p class="final-score-label">Puntuación</p>
          <p class="final-score" id="finalScore">0</p>
          <p class="best-label">Mejor: <span id="finalBest">0</span></p>
          <button id="restartBtn">Reintentar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <span class="footer-name">Danna Rivera</span>
  <span class="footer-details">Estudiante de Diseño · CEDES Don Bosco Costa Rica</span>
  <div class="nav-buttons">
    <a href="index.html" class="ruta-btn">🏠 Inicio</a>
    <a href="parejas.html" class="ruta-btn">🃏 Parejas</a>
    <a href="ruta-vocacional.html" class="ruta-btn">🌱 Ruta Vocacional</a>
    <a href="chat.html" class="ruta-btn">🤖 Chat IA</a>
  </div>
  <select class="theme-select" id="themeSelect" onchange="setTheme(this.value)">
    <option value="modern">Moderno</option>
    <option value="retro">Win 3.1</option>
  </select>
  <span class="footer-year">© 2026</span>
</footer>
<script src="js/juego.js"></script>
</body>
</html>
